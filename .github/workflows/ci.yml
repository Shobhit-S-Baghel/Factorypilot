name: FactoryPilot Continuous Integration Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: Backend Quality, Linting & Tests
  # ==========================================
  backend-ci:
    name: Backend CI (FastAPI & Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check code formatting and linting with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest test suite
        run: |
          pytest -v --cov=app --cov-report=term-missing tests/

  # ==========================================
  # Job 2: Frontend Quality, Types & Build
  # ==========================================
  frontend-ci:
    name: Frontend CI (Next.js & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Node dependencies
        run: npm install

      - name: TypeScript type checking
        run: npm run type-check

      - name: ESLint check
        run: npm run lint

      - name: Build Next.js standalone bundle (Dry-Run)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ==========================================
  # Job 3: Multi-Container Compose Verification
  # ==========================================
  docker-orchestration-ci:
    name: Docker Compose Topology Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "Docker compose configuration verified successfully."
